spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:eventosdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Consola de H2 (para ver las tablas desde el navegador) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Puerto de la aplicación =====
server.port=8989

# ===== Configuración de AWS S3 =====
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}
spring.cloud.aws.credentials.session-token=${AWS_SESSION_TOKEN:}
spring.cloud.aws.region.static=us-east-1

# Nombre del bucket
aws.s3.bucket-name=bucket-eventos-cloudn

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://vicenteazure.b2clogin.com/451231ab-0594-489d-a665-48b2fb84c090/v2.0/