# ===== Configuración de H2 (base de datos en memoria) =====
spring.datasource.url=jdbc:h2:mem:eventosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Consola de H2 (para ver las tablas desde el navegador) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Puerto de la aplicación =====
server.port=8989

# ===== Configuración de AWS S3 =====
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}
spring.cloud.aws.credentials.session-token=${AWS_SESSION_TOKEN:}
spring.cloud.aws.region.static=us-east-1

# Nombre del bucket
aws.s3.bucket-name=bucket-eventos-cloudn